name: Static validation

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'scripts/**'
      - 'assets/js/**'
      - '.github/workflows/validate-static.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'scripts/**'
      - '.github/workflows/validate-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: HTML inline JavaScript and Dice contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate active pages and manual Dice flow
        run: node scripts/check-static.mjs
