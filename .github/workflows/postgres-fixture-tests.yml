name: PostgreSQL fixture tests

on:
  push:
    branches: [main, "audit/**"]
    paths:
      - "tests/sql/**"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - "supabase/verification/**"
      - ".github/workflows/postgres-fixture-tests.yml"
  pull_request:
    paths:
      - "tests/sql/**"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - "supabase/verification/**"
      - ".github/workflows/postgres-fixture-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vinculo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vinculo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate integration harness syntax
        run: node --check tests/integration/storage-cba-api.mjs

      - name: Run isolated SQL fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/footprint_fixture.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/footprint_test.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/maneuver_catalog_security_fixture.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/priv_default_acl_fixture.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/legacy_character_creation_acl_fixture.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/character_creation_entrypoint_fixture.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/private_cba_storage_access_fixture.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/role_filtered_tabletop_snapshot_fixture.sql
          psql -h 127.0.0.1 -U postgres -d vinculo_test -v ON_ERROR_STOP=1 -f tests/sql/campaign_refresh_broadcast_fixture.sql
          bash tests/sql/lock_cycle_test.sh
