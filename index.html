<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b07">
  <title>Vínculo · Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--gold:#c9a050;--gold-light:#e0b860;--ink:#0d0b07;--panel:#141d33;--muted:#aeb9ca;--red:#f87171;--green:#86efac}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,rgba(56,44,25,.42),transparent 60%),linear-gradient(145deg,#080706,#111827 58%,#080706);color:#f5ecd6;font-family:'EB Garamond',Georgia,serif}
    .login-shell{width:min(100%,440px)}
    .card{position:relative;padding:clamp(24px,6vw,42px);background:rgba(20,29,51,.94);border:1px solid var(--gold);border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.65),inset 0 0 35px rgba(201,160,80,.04)}
    .mark{width:54px;height:54px;margin:0 auto 14px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold-light);font:700 24px 'Cinzel',serif;box-shadow:0 0 24px rgba(201,160,80,.15)}
    h1{margin:0;text-align:center;font:900 clamp(26px,7vw,34px) 'Cinzel',serif;letter-spacing:4px}
    .subtitle{margin:8px 0 28px;text-align:center;color:var(--gold-light);font-size:17px;font-style:italic}
    .field{margin:0 0 17px}
    label{display:block;margin:0 0 7px;color:var(--gold-light);font:700 11px 'Cinzel',serif;letter-spacing:1px;text-transform:uppercase}
    input{width:100%;min-height:46px;padding:11px 13px;border:1px solid #3a4a65;border-radius:4px;background:#0a0f1e;color:#f5ecd6;font:16px 'EB Garamond',Georgia,serif}
    input:focus{outline:2px solid rgba(201,160,80,.6);outline-offset:1px;border-color:var(--gold)}
    button{width:100%;min-height:47px;border:0;border-radius:4px;background:linear-gradient(180deg,#d4ad5a,#b89050);color:#111;font:900 12px 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
    button:hover:not(:disabled){background:linear-gradient(180deg,#e0b860,#c9a050)}
    button:disabled{opacity:.6;cursor:wait}
    .secondary{margin-top:11px;border:1px solid var(--gold);background:transparent;color:var(--gold-light)}
    .secondary:hover:not(:disabled){background:rgba(201,160,80,.12)}
    .message{display:none;margin:16px 0 0;padding:11px 12px;border-radius:4px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
    .message.show{display:block}
    .message.error{background:rgba(184,50,50,.16);color:var(--red);border:1px solid rgba(248,113,113,.35)}
    .message.success{background:rgba(74,122,58,.15);color:var(--green);border:1px solid rgba(134,239,172,.28)}
    .foot{margin:18px 0 0;text-align:center;color:var(--muted);font-size:13px}
    .foot span{color:#d6c9aa}
    @media(max-width:420px){body{padding:15px}.card{padding:25px 20px}.subtitle{margin-bottom:23px}}
    @media(prefers-reduced-motion:no-preference){.card{animation:appear .35s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="card" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true">V</div>
      <h1 id="page-title">VÍNCULO</h1>
      <p class="subtitle">Entre para continuar sua jornada</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required maxlength="254" placeholder="voce@exemplo.com">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Sua senha">
        </div>
        <button id="login-button" type="submit">Entrar</button>
      </form>
      <button id="signup-button" class="secondary" type="button">Criar uma conta</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p class="foot"><span>D&amp;D 3.5</span> · Um mundo para construir em conjunto</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function(){
      'use strict';

      var SUPABASE_URL = 'https://grrgwxcagvvafdmzsmro.supabase.co';
      var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdycmd3eGNhZ3Z2YWZkbXpzbXJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTY4MTQsImV4cCI6MjEwNTgzMjgxNH0.hqLiYynGXHwyUtqcbGTTa2orSStm7ko2C5R03QNmqtQ';
      var form = document.getElementById('login-form');
      var emailInput = document.getElementById('email');
      var passwordInput = document.getElementById('password');
      var loginButton = document.getElementById('login-button');
      var signupButton = document.getElementById('signup-button');
      var message = document.getElementById('message');
      var supabaseClient;

      function showMessage(text, type){
        message.textContent = text;
        message.className = 'message show ' + (type === 'success' ? 'success' : 'error');
      }

      function setBusy(busy){
        loginButton.disabled = busy;
        signupButton.disabled = busy;
        loginButton.textContent = busy ? 'Aguarde…' : 'Entrar';
      }

      function validCredentials(){
        var email = emailInput.value.trim();
        var password = passwordInput.value;
        if(!email || !emailInput.validity.valid){
          showMessage('Informe um endereço de e-mail válido.', 'error');
          emailInput.focus();
          return null;
        }
        if(!password || password.length < 6){
          showMessage('Informe sua senha (mínimo de 6 caracteres).', 'error');
          passwordInput.focus();
          return null;
        }
        return {email:email,password:password};
      }

      function enterLobby(){
        window.location.replace('lobby.html');
      }

      if(!window.supabase || typeof window.supabase.createClient !== 'function'){
        showMessage('Não foi possível carregar o serviço de autenticação. Verifique sua conexão e recarregue a página.', 'error');
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      supabaseClient.auth.getSession().then(function(result){
        if(result.error){
          showMessage('Não foi possível verificar sua sessão. Tente entrar novamente.', 'error');
          return;
        }
        if(result.data && result.data.session) enterLobby();
      }).catch(function(){
        showMessage('Falha ao verificar a sessão. Confira sua conexão e tente novamente.', 'error');
      });

      form.addEventListener('submit', async function(event){
        event.preventDefault();
        var credentials = validCredentials();
        if(!credentials) return;
        setBusy(true);
        message.className = 'message';
        try{
          var result = await supabaseClient.auth.signInWithPassword(credentials);
          if(result.error) throw result.error;
          if(!result.data || !result.data.session){
            showMessage('Login concluído, mas não foi possível iniciar sua sessão. Tente novamente.', 'error');
            setBusy(false);
            return;
          }
          enterLobby();
        }catch(error){
          showMessage(error && error.message ? error.message : 'Não foi possível entrar. Confira seus dados e tente novamente.', 'error');
          setBusy(false);
        }
      });

      signupButton.addEventListener('click', async function(){
        var credentials = validCredentials();
        if(!credentials) return;
        setBusy(true);
        message.className = 'message';
        try{
          var result = await supabaseClient.auth.signUp({
            email: credentials.email,
            password: credentials.password,
            options: {emailRedirectTo: window.location.origin + window.location.pathname}
          });
          if(result.error) throw result.error;
          if(result.data && result.data.session){
            enterLobby();
            return;
          }
          showMessage('Cadastro iniciado. Confira seu e-mail para confirmar a conta e depois entre por aqui.', 'success');
          setBusy(false);
        }catch(error){
          showMessage(error && error.message ? error.message : 'Não foi possível criar a conta. Tente novamente.', 'error');
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
